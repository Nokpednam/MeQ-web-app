<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">MeQ system architecture</title>
  <desc id="desc">The current MeQ web application connects to Supabase Auth, LINE Login, PostgreSQL, Storage, RLS policies, and PostgreSQL scheduled jobs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#557463"/>
    </marker>
    <style>
      .box { fill: #f5faf6; stroke: #215c3d; stroke-width: 2; rx: 14; }
      .user { fill: #d5f26f; }
      .line { fill: none; stroke: #557463; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #173d2b; font: 600 19px Arial, sans-serif; text-anchor: middle; }
      .edge { fill: #557463; font: 15px Arial, sans-serif; text-anchor: middle; }
      .note { fill: #557463; font: 14px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1400" height="600" fill="#ffffff"/>

  <rect class="box user" x="30" y="245" width="190" height="90"/>
  <text class="label" x="125" y="280"><tspan x="125">Player, captain,</tspan><tspan x="125" dy="26">or admin</tspan></text>

  <rect class="box" x="300" y="235" width="230" height="110"/>
  <text class="label" x="415" y="280"><tspan x="415">Next.js web app</tspan><tspan x="415" dy="26">on Vercel</tspan></text>

  <rect class="box" x="640" y="70" width="210" height="85"/>
  <text class="label" x="745" y="120">Supabase Auth</text>

  <rect class="box" x="980" y="70" width="190" height="85"/>
  <text class="label" x="1075" y="120">LINE Login</text>

  <rect class="box" x="625" y="245" width="240" height="100"/>
  <text class="label" x="745" y="285"><tspan x="745">Supabase</tspan><tspan x="745" dy="26">PostgreSQL</tspan></text>

  <rect class="box" x="640" y="405" width="220" height="85"/>
  <text class="label" x="750" y="455">Supabase Storage</text>

  <rect class="box" x="980" y="245" width="240" height="85"/>
  <text class="label" x="1100" y="280"><tspan x="1100">Column grants and</tspan><tspan x="1100" dy="26">RLS policies</tspan></text>

  <rect class="box" x="980" y="405" width="240" height="85"/>
  <text class="label" x="1100" y="440"><tspan x="1100">PostgreSQL</tspan><tspan x="1100" dy="26">scheduled jobs</tspan></text>

  <path class="line" d="M220 290 H300"/>
  <text class="edge" x="260" y="275">HTTPS</text>

  <path class="line" d="M470 235 C520 180 560 125 640 112"/>
  <text class="edge" x="555" y="165">OAuth session</text>

  <path class="line" d="M850 112 H980"/>
  <text class="edge" x="915" y="96">Custom provider</text>

  <path class="line" d="M530 290 H625"/>
  <text class="edge" x="578" y="275">Reads and RPCs</text>

  <path class="line" d="M470 345 C520 390 575 430 640 447"/>
  <text class="edge" x="555" y="405">Private evidence files</text>

  <path class="line" d="M865 295 H980"/>
  <text class="edge" x="922" y="280">Access policy</text>

  <path class="line" d="M800 345 C850 390 910 447 980 447"/>
  <text class="edge" x="900" y="405">Expiry processing</text>

  <path class="line" d="M980 470 C900 560 760 520 745 345"/>
  <text class="note" x="840" y="545">Updates database state</text>
</svg>
